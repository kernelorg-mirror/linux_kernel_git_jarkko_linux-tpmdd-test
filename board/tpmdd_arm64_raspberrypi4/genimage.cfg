image efi-part.vfat {
	vfat {

		file boot/Image {
			image = "Image"
		}

		file config.txt {
			image = "rpi-firmware/config.txt"
		}

		file start4.elf {
			image = "rpi-firmware/start4.elf"
		}

		file fixup4.dat {
			image = "rpi-firmware/fixup4.dat"
		}

		file overlays {
			image = "rpi-firmware/overlays"
		}

		file bcm2711-rpi-400.dtb {
			image = "bcm2711-rpi-400.dtb"
		}

		file u-boot.bin {
			image = "u-boot.bin"
		}

		file boot.scr {
			image = "boot.scr"
		}
	}

	size = 131040K # 128MB - 32KB (boot partition offset)
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}
}
