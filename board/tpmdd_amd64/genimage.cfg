image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file loader {
			image = "efi-part/loader"
		}

		file boot/bzImage {
			image = "bzImage"
		}
	}

	size = 32736K # 32MB - 32KB (boot partition offset)
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = UUID_TMP
		image = "rootfs.ext2"
	}
}
