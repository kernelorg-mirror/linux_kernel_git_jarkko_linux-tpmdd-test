reproducible=yes
hostonly=no
compress=zstd

# dracut's systemd path detection does not account for --sysroot.
systemdutildir=/usr/lib/systemd
systemdsystemunitdir=/usr/lib/systemd/system
udevdir=/usr/lib/udev

add_dracutmodules+=" bash dmsquash-live "
